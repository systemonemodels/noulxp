name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# uv at a fixed version, checked against its sha256: no run picks up a uv
# release nobody chose. To move it, take the sha256 of
# uv-x86_64-unknown-linux-gnu.tar.gz from that version's GitHub release.
env:
  PINNED_UV: "0.11.9"
  PINNED_UV_SHA256: "5c43f82077ff0cd5aec588286cbabd89913e4d045bd4e8aa60b20b3ecffc36e3"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every Python the package claims to support, oldest first.
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.PINNED_UV }}
          checksum: ${{ env.PINNED_UV_SHA256 }}
          # nothing to cache: the build needs no dependencies
          enable-cache: false
      # The build backend at the versions and hashes the release uses.
      - run: uv build -b .github/build-constraints.txt --require-hashes
      - name: The metadata and README PyPI will render
        run: uvx twine==7.0.0 check --strict dist/*
