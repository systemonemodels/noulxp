name: release

# Publishes to PyPI when a version tag like v0.1.0 is pushed; a tag like
# v0.4.0-opendxp publishes the opendxp redirect alone. See RELEASING.md.
#
# The jobs are split by what they trust. build makes the files from the tagged
# source with nothing but uv and the pinned build backend, and records their
# digests. test and check run third-party code (pytest, onnx and the other dev
# dependencies, twine, the wheels' dependencies) on runners of their own.
# publish, the one job PyPI trusts, runs only pypa's action, and only on files
# whose digests are build's.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# uv at a fixed version, checked against its sha256: no run picks up a uv
# release nobody chose. To move it, take the sha256 of
# uv-x86_64-unknown-linux-gnu.tar.gz from that version's GitHub release.
env:
  PINNED_UV: "0.11.9"
  PINNED_UV_SHA256: "5c43f82077ff0cd5aec588286cbabd89913e4d045bd4e8aa60b20b3ecffc36e3"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      dist: ${{ steps.digests.outputs.dist }}
      dist_legacy: ${{ steps.digests.outputs.dist_legacy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.PINNED_UV }}
          checksum: ${{ env.PINNED_UV_SHA256 }}
          # Nothing in a release comes from a cache another run saved.
          enable-cache: false

      # A tag that disagrees with the package version would publish a release
      # whose name lies about its contents, and PyPI never lets a version be
      # replaced once it exists. vX.Y.Z-opendxp is the opendxp redirect alone,
      # at its own version, for when its release missed it.
      - name: Tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [[ "$tag" == *-opendxp ]]; then
            legacy=$(grep -m1 '^version' legacy/opendxp/pyproject.toml | cut -d'"' -f2)
            if [ "${tag%-opendxp}" != "$legacy" ]; then
              echo "::error::tag v$tag and the opendxp redirect's version $legacy must match"
              exit 1
            fi
            echo "REDIRECT_ONLY=1" >> "$GITHUB_ENV"
            exit 0
          fi
          version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          code=$(grep -m1 '^__version__' src/noulxp/__init__.py | cut -d'"' -f2)
          if [ "$tag" != "$version" ] || [ "$tag" != "$code" ]; then
            echo "::error::tag v$tag, pyproject $version and __version__ $code must all match"
            exit 1
          fi

      # The build backend at fixed versions, checked against their hashes.
      - run: uv build -b .github/build-constraints.txt --require-hashes
        if: env.REDIRECT_ONLY != '1'

      # opendxp, the old name, is a package that installs noulxp. It is built
      # when its version is this tag's (0.4.0, the rename) and not after, since
      # PyPI refuses a version twice.
      - name: The opendxp redirect, at the rename
        run: |
          tag="${GITHUB_REF_NAME#v}"
          legacy=$(grep -m1 '^version' legacy/opendxp/pyproject.toml | cut -d'"' -f2)
          if [ "${tag%-opendxp}" = "$legacy" ]; then
            uv build legacy/opendxp -o dist-legacy/ -b .github/build-constraints.txt --require-hashes
          fi

      # What publish checks the files it uploads against.
      - name: Digests of the files to publish
        id: digests
        run: |
          for d in dist dist-legacy; do
            if [ -d "$d" ]; then
              echo "${d/-/_}=$(cd "$d" && sha256sum * | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
            fi
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: hashFiles('dist/*') != ''
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: hashFiles('dist-legacy/*') != ''
        with:
          name: dist-legacy
          path: dist-legacy/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.PINNED_UV }}
          checksum: ${{ env.PINNED_UV_SHA256 }}
          # Nothing in a release comes from a cache another run saved.
          enable-cache: false

      - name: Test on the oldest and newest supported Python
        # The redirect alone (vX.Y.Z-opendxp) has no noulxp to test.
        if: ${{ !endsWith(github.ref_name, '-opendxp') }}
        run: |
          for py in 3.11 3.13; do
            uv venv --python "$py" "/tmp/test-$py"
            uv pip install --python "/tmp/test-$py/bin/python" -e ".[dev]"
            "/tmp/test-$py/bin/python" -m pytest -q
          done

  check:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - if: needs.build.outputs.dist != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - if: needs.build.outputs.dist_legacy != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-legacy
          path: dist-legacy/
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.PINNED_UV }}
          checksum: ${{ env.PINNED_UV_SHA256 }}
          # Nothing in a release comes from a cache another run saved.
          enable-cache: false

      - run: uvx twine==7.0.0 check --strict $(ls dist/* dist-legacy/* 2>/dev/null)

      - name: The wheels install and run in a clean environment
        run: |
          python -m venv /tmp/check
          if ls dist/noulxp-*.whl >/dev/null 2>&1; then
            /tmp/check/bin/pip install dist/noulxp-*.whl
            /tmp/check/bin/noulxp --version
            /tmp/check/bin/noulxp info
          fi
          if ls dist-legacy/opendxp-*.whl >/dev/null 2>&1; then
            # Alone, the redirect takes noulxp from PyPI.
            /tmp/check/bin/pip install dist-legacy/opendxp-*.whl
            /tmp/check/bin/opendxp --version
            /tmp/check/bin/python -W ignore -c "import opendxp.package, noulxp.package; assert opendxp.package is noulxp.package"
          fi

  publish:
    needs: [build, test, check]
    runs-on: ubuntu-latest
    # Bound to the PyPI trusted publisher, and gated by the environment's
    # required reviewer: nothing reaches PyPI without a click.
    environment:
      name: pypi
      url: https://pypi.org/project/noulxp/
    permissions:
      # Trusted Publishing, and the signature on each file.
      id-token: write
    steps:
      - if: needs.build.outputs.dist != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - if: needs.build.outputs.dist_legacy != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-legacy
          path: dist-legacy/

      # test and check ran other code in this run, which can replace an
      # artifact; the digests from build's own outputs cannot be.
      - name: The files are the ones build made
        env:
          DIST: ${{ needs.build.outputs.dist }}
          DIST_LEGACY: ${{ needs.build.outputs.dist_legacy }}
        run: |
          same() {
            [ -z "$2" ] && return 0
            [ "$(cd "$1" && sha256sum * | sha256sum | cut -d' ' -f1)" = "$2" ] && return 0
            echo "::error::$1/ is not what the build job made"
            return 1
          }
          same dist "$DIST" && same dist-legacy "$DIST_LEGACY"

      - if: needs.build.outputs.dist != ''
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

      # The opendxp redirect, when this release has one. PyPI must trust this
      # repository for the opendxp project too (RELEASING.md); when it does
      # not, noulxp is out all the same, and this step says why.
      - if: needs.build.outputs.dist_legacy != ''
        # Beside noulxp it must not fail the release; alone, it is the release.
        continue-on-error: ${{ !endsWith(github.ref_name, '-opendxp') }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist-legacy/
