[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "opendxp"
version = "0.1.0"
description = "OpenDXP, the Open Decision Exchange Protocol: a portable standard for calibrated single-pass decision models (reference implementation)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "System One Models" }]
keywords = ["opendxp", "system-one", "decision-models", "onnx", "gguf", "calibration", "conformance"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The core (request parsing, templates, calibration, conformance) needs only these.
dependencies = ["numpy>=1.26", "tokenizers>=0.20", "jsonschema>=4.20"]

[project.optional-dependencies]
# Runtimes: one per profile.
onnx = ["onnxruntime>=1.20"]
gguf = ["llama-cpp-python>=0.3.35,<0.4"]
# Converters: torch export to ONNX, and the Laya package for Laya checkpoints.
export = [
  "torch>=2.6",
  "transformers>=5.2",
  "safetensors>=0.4",
  "onnx>=1.17",
  "onnxscript>=0.5",
  "onnx-ir>=0.1.15",
]
laya = ["laya==0.3.5"]
dev = ["pytest>=8", "ruff>=0.6", "onnx>=1.17", "onnxruntime>=1.20"]

[project.scripts]
opendxp = "opendxp.cli:main"

[project.urls]
Specification = "https://github.com/systemonemodels/opendxp/blob/main/SPEC.md"

[tool.hatch.build.targets.wheel]
packages = ["src/opendxp"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "opendxp/schemas"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_requests.py" = ["E501"]
# The oracles are the models' own code, kept verbatim.
"tests/oracles.py" = ["UP031", "RUF005", "B905", "E501"]
# The native runtimes follow the models' own code line by line.
"src/opendxp/native/*.py" = ["RUF005"]
"tests/*.py" = ["E501"]
